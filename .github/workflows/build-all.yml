name: Hasani ARMS Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:

  # ============================================================
  # BACKEND CHECK
  # ============================================================
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # NODE.JS 20
      # ----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json


      # ----------------------------------------------------------
      # INSTALL BACKEND DEPENDENCIES
      # ----------------------------------------------------------
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci


      # ----------------------------------------------------------
      # CHECK server.js
      # ----------------------------------------------------------
      - name: Check server.js
        working-directory: backend
        run: |
          if [ -f src/server.js ]; then
            echo "Checking src/server.js..."
            node --check src/server.js
            echo "server.js OK"
          else
            echo "src/server.js not found - skipping"
          fi


      # ----------------------------------------------------------
      # CHECK arms.js
      # ----------------------------------------------------------
      - name: Check arms.js
        working-directory: backend
        run: |
          if [ -f src/arms.js ]; then
            echo "Checking src/arms.js..."
            node --check src/arms.js
            echo "arms.js OK"
          else
            echo "src/arms.js not found - skipping"
          fi


      # ----------------------------------------------------------
      # CHECK arms-session.js
      # ----------------------------------------------------------
      - name: Check arms-session.js
        working-directory: backend
        run: |
          if [ -f src/arms-session.js ]; then
            echo "Checking src/arms-session.js..."
            node --check src/arms-session.js
            echo "arms-session.js OK"
          else
            echo "src/arms-session.js not found - skipping"
          fi


  # ============================================================
  # ANDROID APK
  # ============================================================
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # JAVA 17
      # ----------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ----------------------------------------------------------
      # FLUTTER
      #
      # IMPORTANT:
      # Cache is intentionally disabled.
      #
      # Your previous build failed because the downloaded Flutter
      # archive was corrupted / incomplete.
      # ----------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: false


      # ----------------------------------------------------------
      # SHOW VERSIONS
      # ----------------------------------------------------------
      - name: Show Flutter version
        run: |
          flutter --version


      - name: Show Dart version
        run: |
          dart --version


      - name: Show Java version
        run: |
          java -version


      # ----------------------------------------------------------
      # VERIFY FLUTTER PROJECT
      # ----------------------------------------------------------
      - name: Verify Flutter project
        run: |
          echo "Checking Flutter project..."

          test -f pubspec.yaml
          test -d lib

          echo "pubspec.yaml found."
          echo "lib directory found."
          echo "Flutter project verified."


      # ----------------------------------------------------------
      # PREPARE ANDROID PROJECT
      #
      # Your GitHub repository currently does NOT contain the
      # Android platform folder.
      #
      # Flutter will generate it here automatically.
      # ----------------------------------------------------------
      - name: Prepare Android project
        run: |

          if [ ! -f android/gradlew ]; then

            echo "Android project not found."
            echo "Generating Android platform..."

            rm -rf android

            flutter create \
              --platforms=android \
              --no-pub \
              .

            echo "Android platform generated successfully."

          else

            echo "Existing Android project found."
            echo "Using existing Android project."

          fi


      # ----------------------------------------------------------
      # VERIFY ANDROID PROJECT
      # ----------------------------------------------------------
      - name: Verify Android project
        run: |

          echo "Verifying Android project..."

          test -d android
          test -d android/app
          test -f android/gradlew

          if [ -f android/settings.gradle ]; then
            echo "settings.gradle found."
          elif [ -f android/settings.gradle.kts ]; then
            echo "settings.gradle.kts found."
          else
            echo "ERROR: Android settings file not found."
            exit 1
          fi

          echo "Android project verified."


      # ----------------------------------------------------------
      # ADD INTERNET PERMISSION
      # ----------------------------------------------------------
      - name: Configure Android Internet permission
        run: |

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo "Checking AndroidManifest.xml..."

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml was not generated."
            exit 1
          fi

          echo "AndroidManifest.xml found."


          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then

            echo "Internet permission already exists."

          else

            echo "Adding Internet permission..."

            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"

            echo "Internet permission added."

          fi


          echo "Final Android manifest:"
          cat "$MANIFEST"


      # ----------------------------------------------------------
      # FLUTTER CLEAN
      # ----------------------------------------------------------
      - name: Flutter clean
        run: |
          flutter clean


      # ----------------------------------------------------------
      # GET FLUTTER DEPENDENCIES
      # ----------------------------------------------------------
      - name: Get Flutter dependencies
        run: |
          flutter pub get


      # ----------------------------------------------------------
      # ANALYZE APPLICATION
      # ----------------------------------------------------------
      - name: Analyze Flutter application
        run: |
          flutter analyze lib


      # ----------------------------------------------------------
      # BUILD DEBUG APK
      #
      # The APK connects to your live Render backend:
      #
      # https://hasaniarms.onrender.com
      #
      # DO NOT use localhost.
      # DO NOT use 192.168.x.x.
      # ----------------------------------------------------------
      - name: Build Debug APK
        run: |

          set -o pipefail

          echo "Building Hasani ARMS APK..."

          flutter build apk \
            --debug \
            --dart-define=API_BASE_URL=https://hasaniarms.onrender.com \
            --verbose \
            2>&1 | tee build.log


      # ----------------------------------------------------------
      # VERIFY APK
      # ----------------------------------------------------------
      - name: Verify APK
        run: |

          APK="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"


      # ----------------------------------------------------------
      # UPLOAD APK
      # ----------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hasani-arms-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error


      # ----------------------------------------------------------
      # SHOW BUILD LOG ON FAILURE
      # ----------------------------------------------------------
      - name: Show build log on failure
        if: failure()
        run: |

          echo ""
          echo "========================================"
          echo "BUILD FAILED"
          echo "========================================"

          if [ -f build.log ]; then

            echo ""
            echo "LAST 250 LINES OF BUILD LOG"
            echo "----------------------------------------"

            tail -n 250 build.log

          else

            echo "No build.log was created."
            echo "The failure happened before the APK build step."

          fi
