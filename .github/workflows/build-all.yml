name: Hasani ARMS Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:

  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend
        working-directory: backend
        run: npm ci

      - name: Check Backend
        working-directory: backend
        run: |
          if [ -f src/server.js ]; then
            node --check src/server.js
          fi

          if [ -f src/arms.js ]; then
            node --check src/arms.js
          fi

          if [ -f src/arms-session.js ]; then
            node --check src/arms-session.js
          fi


  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Check Flutter Project
        run: test -f pubspec.yaml

      - name: Prepare Android Project
        run: |
          if [ ! -f android/gradlew ]; then
            rm -rf android
            flutter create --platforms=android --no-pub .
          fi

      - name: Check Android Project
        run: test -f android/gradlew

      - name: Clean
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Check APK
        run: test -f build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hasani-arms-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
