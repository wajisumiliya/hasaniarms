  web-backend-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # Force setup-node to look for the lockfile in the correct path
          cache-dependency-path: 'hasaniarms/backend/package-lock.json'

      # Explicitly set the environment variable so the cache path resolves correctly
      env:
        NODE_WORKSPACE: 'hasaniarms/backend'
      - name: Install dependencies
        run: npm ci
        working-directory: hasaniarms/backend

      - name: Check syntax
        run: |
          node --check src/server.js
          node --check src/arms.js
          node --check src/arms-session.js
        working-directory: hasaniarms/backend
