name: Build Hasani Arms

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  web-backend-check:
    runs-on: ubuntu-latest
    # REMOVED defaults.run.working-directory from here to prevent setup-node path resolution issues

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # Use a relative path from the repository root
          cache-dependency-path: 'hasaniarms/backend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: hasaniarms/backend

      - name: Check syntax
        run: |
          node --check src/server.js
          node --check src/arms.js
          node --check src/arms-session.js
        working-directory: hasaniarms/backend

  flutter-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hasaniarms

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - run: flutter pub get
      - run: flutter build apk --debug
