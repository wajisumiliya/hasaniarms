name: Build Hasani Customer App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  web-backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hasani_customer_app/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hasani_customer_app/backend/package-lock.json

      - run: npm ci

      - run: node --check src/server.js
      - run: node --check src/arms.js
      - run: node --check src/arms-session.js

  flutter-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hasani_customer_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - run: flutter pub get
      - run: flutter build apk --debug
