name: Hasani ARMS Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:

  # ============================================================
  # BACKEND CHECK
  # ============================================================
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # CHECKOUT REPOSITORY
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # SETUP NODE.JS 20
      # ----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json


      # ----------------------------------------------------------
      # INSTALL BACKEND DEPENDENCIES
      # ----------------------------------------------------------
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci


      # ----------------------------------------------------------
      # CHECK server.js
      # ----------------------------------------------------------
      - name: Check server.js
        working-directory: backend
        run: |
          if [ -f src/server.js ]; then
            echo "Checking src/server.js..."
            node --check src/server.js
            echo "server.js OK"
          else
            echo "src/server.js not found - skipping"
          fi


      # ----------------------------------------------------------
      # CHECK arms.js
      # ----------------------------------------------------------
      - name: Check arms.js
        working-directory: backend
        run: |
          if [ -f src/arms.js ]; then
            echo "Checking src/arms.js..."
            node --check src/arms.js
            echo "arms.js OK"
          else
            echo "src/arms.js not found - skipping"
          fi


      # ----------------------------------------------------------
      # CHECK arms-session.js
      # ----------------------------------------------------------
      - name: Check arms-session.js
        working-directory: backend
        run: |
          if [ -f src/arms-session.js ]; then
            echo "Checking src/arms-session.js..."
            node --check src/arms-session.js
            echo "arms-session.js OK"
          else
            echo "src/arms-session.js not found - skipping"
          fi


  # ============================================================
  # ANDROID APK
  # ============================================================
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # CHECKOUT REPOSITORY
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # SETUP JAVA 17
      #
      # IMPORTANT:
      # No Gradle cache here.
      #
      # The repository currently does not contain the Android
      # Gradle project. Flutter creates it later in this workflow.
      # ----------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ----------------------------------------------------------
      # SETUP FLUTTER
      #
      # Cache is disabled because the previous Flutter download
      # failed with:
      #
      # tar: This does not look like a tar archive
      #
      # This forces a fresh Flutter download.
      # ----------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: false


      # ----------------------------------------------------------
      # SHOW FLUTTER VERSION
      # ----------------------------------------------------------
      - name: Show Flutter version
        run: |
          echo "========================================"
          echo "Flutter version"
          echo "========================================"
          flutter --version


      # ----------------------------------------------------------
      # SHOW DART VERSION
      # ----------------------------------------------------------
      - name: Show Dart version
        run: |
          echo "========================================"
          echo "Dart version"
          echo "========================================"
          dart --version


      # ----------------------------------------------------------
      # SHOW JAVA VERSION
      # ----------------------------------------------------------
      - name: Show Java version
        run: |
          echo "========================================"
          echo "Java version"
          echo "========================================"
          java -version


      # ----------------------------------------------------------
      # VERIFY FLUTTER PROJECT
      # ----------------------------------------------------------
      - name: Verify Flutter project
        run: |

          echo "========================================"
          echo "VERIFYING FLUTTER PROJECT"
          echo "========================================"

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          if [ ! -d lib ]; then
            echo "ERROR: lib directory not found."
            exit 1
          fi

          echo "pubspec.yaml found."
          echo "lib directory found."
          echo "Flutter project verified."


      # ----------------------------------------------------------
      # SHOW PROJECT STRUCTURE
      # ----------------------------------------------------------
      - name: Show project structure
        run: |

          echo "========================================"
          echo "PROJECT STRUCTURE"
          echo "========================================"

          echo "Root:"
          ls -la

          echo ""
          echo "lib:"
          ls -la lib || true

          echo ""
          echo "backend:"
          ls -la backend || true


      # ----------------------------------------------------------
      # PREPARE ANDROID PROJECT
      #
      # Your GitHub repository currently does not contain the
      # Android platform folder.
      #
      # Flutter will generate the Android project automatically.
      # ----------------------------------------------------------
      - name: Prepare Android project
        run: |

          echo "========================================"
          echo "PREPARING ANDROID PROJECT"
          echo "========================================"

          if [ ! -f android/gradlew ]; then

            echo "Android project does not exist."
            echo "Generating Android platform..."

            rm -rf android

            flutter create \
              --platforms=android \
              --no-pub \
              .

            echo ""
            echo "Android project generated successfully."

          else

            echo "Existing Android project found."
            echo "Using existing Android project."

          fi


      # ----------------------------------------------------------
      # VERIFY ANDROID PROJECT
      # ----------------------------------------------------------
      - name: Verify Android project
        run: |

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          if [ ! -d android ]; then
            echo "ERROR: android directory not found."
            exit 1
          fi

          if [ ! -d android/app ]; then
            echo "ERROR: android/app directory not found."
            exit 1
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERROR: android/gradlew not found."
            exit 1
          fi

          if [ -f android/settings.gradle ]; then
            echo "settings.gradle found."
          elif [ -f android/settings.gradle.kts ]; then
            echo "settings.gradle.kts found."
          else
            echo "ERROR: Android settings file not found."
            exit 1
          fi

          echo ""
          echo "Android project verified successfully."


      # ----------------------------------------------------------
      # CONFIGURE INTERNET PERMISSION
      # ----------------------------------------------------------
      - name: Configure Android Internet permission
        run: |

          echo "========================================"
          echo "CONFIGURING INTERNET PERMISSION"
          echo "========================================"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "AndroidManifest.xml found."


          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then

            echo "Internet permission already exists."

          else

            echo "Adding Internet permission..."

            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"

            echo "Internet permission added."

          fi


      # ----------------------------------------------------------
      # VERIFY INTERNET PERMISSION
      # ----------------------------------------------------------
      - name: Verify Internet permission
        run: |

          echo "========================================"
          echo "VERIFYING INTERNET PERMISSION"
          echo "========================================"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "Internet permission verified."
          else
            echo "ERROR: Internet permission was not found."
            exit 1
          fi


      # ----------------------------------------------------------
      # DISPLAY MANIFEST
      # ----------------------------------------------------------
      - name: Display Android manifest
        run: |

          echo "========================================"
          echo "ANDROID MANIFEST"
          echo "========================================"

          cat android/app/src/main/AndroidManifest.xml


      # ----------------------------------------------------------
      # FLUTTER CLEAN
      # ----------------------------------------------------------
      - name: Flutter clean
        run: |

          echo "========================================"
          echo "FLUTTER CLEAN"
          echo "========================================"

          flutter clean


      # ----------------------------------------------------------
      # GET FLUTTER DEPENDENCIES
      # ----------------------------------------------------------
      - name: Get Flutter dependencies
        run: |

          echo "========================================"
          echo "GETTING FLUTTER DEPENDENCIES"
          echo "========================================"

          flutter pub get


      # ----------------------------------------------------------
      # ANALYZE FLUTTER APPLICATION
      # ----------------------------------------------------------
      - name: Analyze Flutter application
        run: |

          echo "========================================"
          echo "ANALYZING FLUTTER APPLICATION"
          echo "========================================"

          flutter analyze lib


      # ----------------------------------------------------------
      # BUILD DEBUG APK
      #
      # IMPORTANT:
      #
      # The APK uses the live Render backend:
      #
      # https://hasaniarms.onrender.com
      #
      # DO NOT use:
      #
      # localhost
      # 127.0.0.1
      # 192.168.x.x
      #
      # ----------------------------------------------------------
      - name: Build Debug APK
        run: |

          echo "========================================"
          echo "BUILDING HASANI ARMS APK"
          echo "========================================"

          echo ""
          echo "API SERVER:"
          echo "https://hasaniarms.onrender.com"
          echo ""

          set -o pipefail

          flutter build apk \
            --debug \
            --dart-define=API_BASE_URL=https://hasaniarms.onrender.com \
            --verbose \
            2>&1 | tee build.log


      # ----------------------------------------------------------
      # VERIFY APK
      # ----------------------------------------------------------
      - name: Verify APK
        run: |

          echo "========================================"
          echo "VERIFYING APK"
          echo "========================================"

          APK="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "ERROR: APK was not created."
            exit 1

          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"


      # ----------------------------------------------------------
      # UPLOAD DEBUG APK
      # ----------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hasani-arms-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error


      # ----------------------------------------------------------
      # SHOW BUILD LOG IF BUILD FAILS
      # ----------------------------------------------------------
      - name: Show build log on failure
        if: failure()
        run: |

          echo ""
          echo "========================================"
          echo "HASANI ARMS BUILD FAILED"
          echo "========================================"

          if [ -f build.log ]; then

            echo ""
            echo "LAST 250 LINES OF BUILD LOG"
            echo "----------------------------------------"

            tail -n 250 build.log

          else

            echo ""
            echo "No build.log was created."
            echo "The failure happened before the APK build step."

          fi
