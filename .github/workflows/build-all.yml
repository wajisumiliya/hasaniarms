name: Hasani ARMS Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:

  # ============================================================
  # BACKEND CHECK
  # ============================================================
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check server.js
        working-directory: backend
        run: |
          if [ -f src/server.js ]; then
            node --check src/server.js
          else
            echo "src/server.js not found - skipping"
          fi

      - name: Check arms.js
        working-directory: backend
        run: |
          if [ -f src/arms.js ]; then
            node --check src/arms.js
          else
            echo "src/arms.js not found - skipping"
          fi

      - name: Check arms-session.js
        working-directory: backend
        run: |
          if [ -f src/arms-session.js ]; then
            node --check src/arms-session.js
          else
            echo "src/arms-session.js not found - skipping"
          fi


  # ============================================================
  # ANDROID APK
  # ============================================================
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # JAVA 17
      # ----------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ----------------------------------------------------------
      # FLUTTER
      # ----------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ----------------------------------------------------------
      # SHOW VERSIONS
      # ----------------------------------------------------------
      - name: Flutter version
        run: flutter --version

      - name: Java version
        run: java -version


      # ----------------------------------------------------------
      # VERIFY FLUTTER PROJECT
      # ----------------------------------------------------------
      - name: Verify Flutter project
        run: |
          test -f pubspec.yaml
          test -d lib

          echo "Flutter project found."
          echo "pubspec.yaml found."
          echo "lib folder found."


      # ----------------------------------------------------------
      # PREPARE ANDROID PROJECT
      # ----------------------------------------------------------
      - name: Prepare Android project
        run: |
          if [ ! -f android/gradlew ]; then
            echo "Android project is incomplete."
            echo "Generating Android platform..."

            rm -rf android

            flutter create \
              --platforms=android \
              --no-pub \
              .

            echo "Android project generated."
          else
            echo "Android Gradle wrapper already exists."
            echo "Using existing Android project."
          fi


      # ----------------------------------------------------------
      # VERIFY ANDROID PROJECT
      # ----------------------------------------------------------
      - name: Verify Android project
        run: |
          test -d android
          test -f android/gradlew
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -d android/app

          echo "Android project verified."


      # ----------------------------------------------------------
      # FLUTTER CLEAN
      # ----------------------------------------------------------
      - name: Flutter clean
        run: flutter clean


      # ----------------------------------------------------------
      # GET DEPENDENCIES
      # ----------------------------------------------------------
      - name: Get Flutter dependencies
        run: flutter pub get


      # ----------------------------------------------------------
      # ANALYZE ONLY APPLICATION CODE
      #
      # We intentionally analyze lib/ instead of the default
      # test/widget_test.dart because the generated test may not
      # match the current Flutter project.
      # ----------------------------------------------------------
      - name: Analyze Flutter application
        run: flutter analyze lib


      # ----------------------------------------------------------
      # BUILD DEBUG APK
      # ----------------------------------------------------------
      - name: Build Debug APK
        run: |
          set -o pipefail

          flutter build apk \
            --debug \
            --verbose \
            2>&1 | tee build.log


      # ----------------------------------------------------------
      # VERIFY APK
      # ----------------------------------------------------------
      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk

          echo "APK successfully created."
          ls -lh build/app/outputs/flutter-apk/app-debug.apk


      # ----------------------------------------------------------
      # UPLOAD APK
      # ----------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hasani-arms-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error


      # ----------------------------------------------------------
      # SHOW BUILD LOG IF BUILD FAILS
      # ----------------------------------------------------------
      - name: Show build log on failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            echo "========================================"
            echo "LAST 250 LINES OF BUILD LOG"
            echo "========================================"
            tail -n 250 build.log
          else
            echo "No build.log was created."
            echo "The failure happened before the APK build step."
          fi
